<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Measure image</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f4f5; --panel: #fff; --text: #18181b; --muted: #71717a; --border: #d4d4d8;
    --stage: #e4e4e7; --accent: #2563eb;
    --ref: #ea580c; --line: #2563eb; --path: #9333ea; --area: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --panel: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46;
            --stage: #111113; --accent: #60a5fa; --ref: #fb923c; --line: #60a5fa; --path: #c084fc; --area: #4ade80; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text);
         display: grid; grid-template-columns: 1fr 320px; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; height: auto; } }
  #stage { position: relative; overflow: hidden; background: var(--stage); min-height: 300px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap;
             background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 2; }
  button, input { font: inherit; color: inherit; }
  button { background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--bg); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.active { background: var(--accent); color: #fff; }
  button.primary { background: var(--accent); color: #fff; }
  .sep { width: 1px; background: var(--border); margin: 2px 2px; }
  #hint { position: absolute; bottom: 10px; left: 10px; right: 10px; pointer-events: none; z-index: 2; }
  #hint span { display: inline-block; background: var(--panel); border: 1px solid var(--border);
               border-radius: 8px; padding: 4px 10px; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; z-index: 1; }
  #empty.drag { outline: 3px dashed var(--accent); outline-offset: -12px; }
  #empty p { color: var(--muted); margin: 8px 0 0; }
  aside { background: var(--panel); border-left: 1px solid var(--border); overflow-y: auto; padding: 14px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  summary { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
            margin: 18px 0 6px; cursor: pointer; user-select: none; }
  .badge { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 9px;
           background: var(--bg); border: 1px solid var(--border); text-align: center; letter-spacing: 0; }
  .field { display: flex; align-items: center; gap: 8px; }
  input[type=text], input[type=number] { background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; width: 90px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  li .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  li .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  li .sub { color: var(--muted); font-size: 12px; }
  li .val { font-variant-numeric: tabular-nums; font-weight: 600; flex: none; white-space: nowrap; }
  li input[type=number] { width: 72px; }
  li button { padding: 0 6px; color: var(--muted); }
  select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--border);
           border-radius: 6px; padding: 4px 6px; max-width: 180px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  button.danger { border-color: var(--border); color: #dc2626; }
  #saveNote { margin-top: 10px; }
  #copyScale { margin-top: 8px; max-width: 100%; }
  .none { color: var(--muted); padding: 4px 0; }
  .warn { color: var(--ref); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: grid; gap: 12px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 6px; }
</style>
</head>
<body>

<div id="stage">
  <div id="toolbar">
    <button data-tool="select" title="Select / move points (V)">Select</button>
    <button data-tool="ref" title="Set a known distance (R)">Known distance</button>
    <button data-tool="line" title="Measure a line (L)">Line</button>
    <button data-tool="path" title="Measure a multi-point path (P)">Path</button>
    <button data-tool="area" title="Measure an area (A)">Area</button>
    <div class="sep"></div>
    <button id="fit" title="Fit image to view">Fit</button>
    <button id="finish" class="primary" hidden>Finish</button>
    <select id="sessions" title="Saved images" hidden></select>
    <button id="replace" title="Load a different image">New image</button>
  </div>
  <div id="empty">
    <div>
      <button id="choose" class="primary">Choose image</button>
      <p>or drop or paste one here</p>
    </div>
  </div>
  <canvas id="cv"></canvas>
  <div id="hint"><span id="hintText"></span></div>
</div>

<aside>
  <h2>Scale</h2>
  <div class="field"><label for="unit">Unit</label><input id="unit" type="text" value="m" maxlength="8"></div>
  <div id="scaleInfo" class="none"></div>

  <details open>
    <summary>Known distances <span class="badge" id="refCount">0</span></summary>
    <ul id="refList"></ul>
    <select id="copyScale" hidden></select>
  </details>
  <details open>
    <summary>Lines <span class="badge" id="lineCount">0</span></summary>
    <ul id="lineList"></ul>
  </details>
  <details open>
    <summary>Paths <span class="badge" id="pathCount">0</span></summary>
    <ul id="pathList"></ul>
  </details>
  <details open>
    <summary>Areas <span class="badge" id="areaCount">0</span></summary>
    <ul id="areaList"></ul>
  </details>

  <h2>This image</h2>
  <div class="actions">
    <button id="clearData" class="danger" title="Remove all measurements but keep the image">Clear measurements</button>
    <button id="deleteImage" class="danger" title="Remove the image and its measurements">Delete image</button>
  </div>
  <div id="saveNote" class="warn" hidden></div>
</aside>

<input id="file" type="file" accept="image/*" hidden>

<dialog id="dlg">
  <form id="dlgForm">
    <label>Length of this known distance
      <div class="field" style="margin-top:6px">
        <input id="dlgLen" type="number" min="0" step="any" required>
        <span id="dlgUnit"></span>
      </div>
    </label>
    <div class="btns">
      <button type="button" id="dlgCancel">Cancel</button>
      <button class="primary">Set</button>
    </div>
  </form>
</dialog>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let img = null;
let view = { k: 1, x: 0, y: 0 };
let tool = 'select';
let draft = [];          // points of the shape being drawn (image coordinates)
let cursor = null;       // last pointer position (screen coordinates)
let pendingRef = null;   // reference awaiting a length from the dialog
let data = { refs: [], lines: [], paths: [], areas: [] };
let counters = { ref: 0, line: 0, path: 0, area: 0 };

const unit = () => $('unit').value.trim() || 'units';
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const toScreen = p => ({ x: p.x * view.k + view.x, y: p.y * view.k + view.y });
const toImg = s => ({ x: (s.x - view.x) / view.k, y: (s.y - view.y) / view.k });
const fmt = n => n.toLocaleString(undefined, { maximumSignificantDigits: 4 });

// Pixels per unit: total reference pixels over total reference length.
// Known distances win; a scale copied from another image is used only when there are none.
function scaleOf(d) {
  if (d.refs.length) {
    const px = d.refs.reduce((s, r) => s + dist(r.a, r.b), 0);
    const len = d.refs.reduce((s, r) => s + r.length, 0);
    return px / len;
  }
  return d.imported ? d.imported.pxPerUnit : null;
}
const scale = () => scaleOf(data);
function polyArea(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    s += a.x * b.y - b.x * a.y;
  }
  return Math.abs(s) / 2;
}
function perimeter(pts) {
  return pts.reduce((s, p, i) => s + dist(p, pts[(i + 1) % pts.length]), 0);
}
function pathLength(pts) {
  return pts.slice(1).reduce((s, p, i) => s + dist(pts[i], p), 0);
}
const centroid = pts => ({ x: pts.reduce((s, p) => s + p.x, 0) / pts.length, y: pts.reduce((s, p) => s + p.y, 0) / pts.length });

// ---------- image loading ----------
let db = null, current = null, saveTimer = null, imgUrl = null;
let records = [];        // {id, name, updated} for every saved image

const emptyData = () => ({ refs: [], lines: [], paths: [], areas: [], imported: null });
const emptyCounters = () => ({ ref: 0, line: 0, path: 0, area: 0 });

function tx(mode, fn) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('images', mode);
    const r = fn(t.objectStore('images'));
    t.oncomplete = () => resolve(r?.result);
    t.onerror = t.onabort = () => reject(t.error);
  });
}
function saveFailed(err) {
  console.error(err);
  $('saveNote').textContent = 'Changes are not being saved: ' + (err?.message || 'browser storage failed') + '.';
  $('saveNote').hidden = false;
}
async function initStorage() {
  try {
    db = await new Promise((resolve, reject) => {
      const r = indexedDB.open('measure-image', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images', { keyPath: 'id', autoIncrement: true });
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
    navigator.storage?.persist?.();
  } catch (err) {
    db = null;
    saveFailed(new Error('browser storage is unavailable'));
  }
}
async function refreshList() {
  records = db ? (await tx('readonly', s => s.getAll())).map(r => ({ id: r.id, name: r.name, updated: r.updated, scale: scaleOf(r.data), unit: r.unit })) : [];
  const sel = $('sessions');
  sel.replaceChildren(...[...records].sort((a, b) => b.id - a.id).map(r => h('option', { value: r.id, textContent: r.name })));
  sel.hidden = !records.length;
  if (current) sel.value = current.id;
  renderCopy();
}
function renderCopy() {
  const sel = $('copyScale');
  const opts = records.filter(r => r.scale && (!current || r.id !== current.id)).sort((a, b) => b.id - a.id);
  sel.replaceChildren(h('option', { value: '', textContent: 'Copy scale from…' }),
    ...opts.map(r => h('option', { value: r.id, textContent: `${r.name} (${fmt(r.scale)} px per ${r.unit})` })));
  sel.hidden = !img || !opts.length;
}
$('copyScale').onchange = e => {
  const r = records.find(r => r.id === Number(e.target.value));
  e.target.value = '';
  if (!r || !img) return;
  data.imported = { pxPerUnit: r.scale, unit: r.unit, from: r.name };
  if (!data.refs.length) $('unit').value = r.unit;
  renderAll(); updateHint();
};
function scheduleSave() {
  if (!db || !current || !img) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 300);
}
async function flush() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!db || !current || !img) return;
  try {
    await tx('readwrite', s => s.put({
      id: current.id, name: current.name, blob: current.blob,
      data, counters, unit: $('unit').value, updated: Date.now(),
    }));
  } catch (err) { saveFailed(err); }
}
addEventListener('pagehide', () => { if (saveTimer) flush(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) flush(); });

// Safari hands back file-backed blobs from IndexedDB that can transiently fail to load
// (WebKitBlobResource error 1). Copy into memory, retrying, and use the copy from then on.
async function readBlob(blob) {
  for (let i = 0; ; i++) {
    try { return new Blob([await blob.arrayBuffer()], { type: blob.type }); }
    catch (err) {
      if (i === 3) throw err;
      await new Promise(r => setTimeout(r, 150));
    }
  }
}
async function openRecord(rec) {
  const abort = msg => { alert(msg); if (current) $('sessions').value = current.id; };
  try { rec.blob = await readBlob(rec.blob); }
  catch (err) { console.error(err); return abort('The saved image could not be read from browser storage.'); }
  const url = URL.createObjectURL(rec.blob);
  const im = new Image();
  im.src = url;
  try { await im.decode(); }
  catch { URL.revokeObjectURL(url); return abort('That file could not be read as an image.'); }
  if (imgUrl) URL.revokeObjectURL(imgUrl);
  imgUrl = url;

  if (saveTimer) await flush();
  if (db && rec.id == null) {
    try { rec.id = await tx('readwrite', s => s.put(rec)); } catch (err) { saveFailed(err); }
  }
  img = im;
  current = { id: rec.id, name: rec.name, blob: rec.blob };
  // Records saved before a data field existed (e.g. paths) lack it; fill in defaults.
  data = { ...emptyData(), ...rec.data };
  counters = { ...emptyCounters(), ...rec.counters };
  $('unit').value = rec.unit;
  draft = []; pendingRef = null;
  setTool('select');
  fit();
  renderAll();
  await refreshList();
}
async function loadFile(file, name) {
  if (!file || !file.type.startsWith('image/')) return;
  await openRecord({ name: name || file.name, blob: file, data: emptyData(), counters: emptyCounters(),
                     unit: $('unit').value, updated: Date.now() });
}

$('sessions').onchange = async e => {
  const rec = await tx('readonly', s => s.get(Number(e.target.value)));
  if (rec) openRecord(rec);
};
$('clearData').onclick = () => {
  if (!img || !confirm('Clear all measurements and known distances for this image? The image is kept.')) return;
  data = emptyData(); counters = emptyCounters(); draft = [];
  setTool('select');
  renderAll(); updateHint();
};
$('deleteImage').onclick = async () => {
  if (!img || !confirm(`Delete “${current.name}” and all its measurements?`)) return;
  clearTimeout(saveTimer); saveTimer = null;
  const id = current.id;
  current = null;
  if (db && id != null) {
    try { await tx('readwrite', s => s.delete(id)); } catch (err) { saveFailed(err); }
  }
  await refreshList();
  const next = [...records].sort((a, b) => b.updated - a.updated)[0];
  if (next) return openRecord(await tx('readonly', s => s.get(next.id)));
  img = null; data = emptyData(); counters = emptyCounters(); draft = [];
  setTool('select');
  renderAll(); updateHint();
};

(async () => {
  await initStorage();
  if (!db) return;
  await refreshList();
  const latest = [...records].sort((a, b) => b.updated - a.updated)[0];
  if (latest) await openRecord(await tx('readonly', s => s.get(latest.id)));
})();
$('choose').onclick = $('replace').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
addEventListener('paste', e => {
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (f) loadFile(f, 'Pasted ' + new Date().toLocaleString());
});
addEventListener('dragover', e => { e.preventDefault(); $('empty').classList.add('drag'); });
addEventListener('dragleave', () => $('empty').classList.remove('drag'));
addEventListener('drop', e => { e.preventDefault(); $('empty').classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });

// ---------- view ----------
function resize() {
  const r = stage.getBoundingClientRect(), d = devicePixelRatio || 1;
  cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
  draw();
}
new ResizeObserver(resize).observe(stage);
function fit() {
  if (!img) return;
  const r = stage.getBoundingClientRect();
  view.k = Math.min(r.width / img.width, r.height / img.height) * 0.95;
  view.x = (r.width - img.width * view.k) / 2;
  view.y = (r.height - img.height * view.k) / 2;
  draw();
}
$('fit').onclick = fit;
cv.addEventListener('wheel', e => {
  if (!img) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015));
  const k = Math.min(Math.max(view.k * f, 0.02), 50), a = k / view.k;
  view.x = mx - (mx - view.x) * a; view.y = my - (my - view.y) * a; view.k = k;
  draw();
}, { passive: false });

// ---------- tools ----------
function setTool(t) {
  if ((t === 'line' || t === 'path' || t === 'area') && !scale()) t = 'select';
  if (t !== tool) draft = [];
  tool = t;
  document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
  $('finish').hidden = t !== 'area' && t !== 'path';
  $('finish').textContent = t === 'path' ? 'Finish path' : 'Finish area';
  updateHint(); draw();
}
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => img && setTool(b.dataset.tool));
addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const k = e.key.toLowerCase();
  if (!img) return;
  if (k === 'v') setTool('select');
  else if (k === 'r') setTool('ref');
  else if (k === 'l') setTool('line');
  else if (k === 'p') setTool('path');
  else if (k === 'a') setTool('area');
  else if (k === 'escape') { draft = []; draw(); updateHint(); }
  else if (k === 'backspace' && draft.length) { draft.pop(); draw(); updateHint(); e.preventDefault(); }
  else if (k === 'enter' && (tool === 'area' || tool === 'path')) finishShape();
});
$('finish').onclick = finishShape;

function updateHint() {
  let t = '';
  if (!img) t = '';
  else if (tool === 'select') t = 'Drag a point to move it. Drag empty space to pan, scroll to zoom.';
  else if (tool === 'ref') t = draft.length ? 'Click the second end of the known distance.' : 'Click one end of a known distance.';
  else if (tool === 'line') t = draft.length ? 'Click the end of the line.' : 'Click the start of the line.';
  else if (tool === 'path') t = draft.length < 2
    ? 'Click to add points.'
    : 'Double-click or press Enter to finish. Backspace removes the last point.';
  else if (tool === 'area') t = draft.length < 3
    ? 'Click to add corners.'
    : 'Click the first point, double-click, or press Enter to finish. Backspace removes the last point.';
  if (img && !scale() && tool === 'select') t = 'Set at least one known distance to enable line and area measurement. ' + t;
  $('hintText').textContent = t;
  $('hint').hidden = !t;
  $('finish').disabled = tool === 'path' ? draft.length < 2 : draft.length < 3;
}

function finishShape() {
  if (tool === 'area' && draft.length >= 3) data.areas.push({ id: ++counters.area, pts: draft });
  else if (tool === 'path' && draft.length >= 2) data.paths.push({ id: ++counters.path, pts: draft });
  else return;
  draft = [];
  renderAll(); updateHint();
}

// ---------- pointer handling ----------
function allPoints() {
  const out = [];
  data.refs.forEach(r => out.push(r.a, r.b));
  data.lines.forEach(l => out.push(l.a, l.b));
  data.paths.forEach(p => out.push(...p.pts));
  data.areas.forEach(a => out.push(...a.pts));
  return out;
}
function hitPoint(s) {
  let best = null, bd = 10;
  for (const p of allPoints()) {
    const d = dist(toScreen(p), s);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}
const posOf = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

let drag = null;
cv.addEventListener('pointerdown', e => {
  if (!img || e.button > 1) return;
  const s = posOf(e);
  cv.setPointerCapture(e.pointerId);
  drag = { s, last: s, moved: false, grab: tool === 'select' ? hitPoint(s) : null, button: e.button };
});
cv.addEventListener('pointermove', e => {
  const s = posOf(e);
  cursor = s;
  if (drag) {
    if (!drag.moved && dist(s, drag.s) > 4) drag.moved = true;
    if (drag.moved) {
      if (drag.grab) {
        const p = toImg(s);
        drag.grab.x = p.x; drag.grab.y = p.y;
        renderLists();
      } else {
        view.x += s.x - drag.last.x; view.y += s.y - drag.last.y;
      }
    }
    drag.last = s;
  } else if (img) {
    cv.style.cursor = tool === 'select' ? (hitPoint(s) ? 'move' : 'grab') : 'crosshair';
  }
  draw();
});
cv.addEventListener('pointerup', e => {
  const d = drag; drag = null;
  if (!d) return;
  if (d.grab && d.moved) renderAll();
  if (!d.moved && d.button === 0) click(posOf(e));
});
cv.addEventListener('pointerleave', () => { cursor = null; draw(); });
cv.addEventListener('dblclick', e => {
  if ((tool !== 'area' && tool !== 'path') || !img) return;
  // the two clicks of the double-click each added a point; drop the duplicate
  draft.pop();
  finishShape();
});

function click(s) {
  const p = toImg(s);
  if (tool === 'ref' || tool === 'line') {
    if (draft.length && dist(toScreen(draft[0]), s) < 3) return;
    draft.push(p);
    if (draft.length === 2) {
      const [a, b] = draft; draft = [];
      if (tool === 'line') data.lines.push({ id: ++counters.line, a, b });
      else return askLength({ a, b });
      renderAll();
    }
  } else if (tool === 'area') {
    if (draft.length >= 3 && dist(toScreen(draft[0]), s) < 10) return finishShape();
    draft.push(p);
  } else if (tool === 'path') {
    draft.push(p);
  }
  updateHint(); draw();
}

// ---------- known-distance dialog ----------
function askLength(ref) {
  pendingRef = ref;
  $('dlgUnit').textContent = unit();
  $('dlgLen').value = '';
  $('dlg').showModal();
  $('dlgLen').focus();
  draw();
}
$('dlgForm').onsubmit = e => {
  e.preventDefault();
  const length = parseFloat($('dlgLen').value);
  if (!(length > 0)) return;
  data.refs.push({ id: ++counters.ref, a: pendingRef.a, b: pendingRef.b, length });
  pendingRef = null;
  $('dlg').close();
  renderAll(); updateHint();
};
$('dlgCancel').onclick = () => $('dlg').close();
$('dlg').addEventListener('close', () => { pendingRef = null; draw(); updateHint(); });
$('unit').oninput = () => renderAll();

// ---------- drawing ----------
function label(text, s, color) {
  ctx.font = '600 13px system-ui, sans-serif';
  const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = 'rgba(0,0,0,.72)';
  ctx.beginPath(); ctx.roundRect(s.x - w / 2, s.y - 11, w, 22, 5); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, s.x, s.y + 1);
}
function dot(s, color) {
  ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
}
function path(pts, close) {
  ctx.beginPath();
  pts.forEach((p, i) => { const s = toScreen(p); i ? ctx.lineTo(s.x, s.y) : ctx.moveTo(s.x, s.y); });
  if (close) ctx.closePath();
}
function drawSegment(a, b, color, text, dashed) {
  ctx.setLineDash(dashed ? [6, 4] : []);
  ctx.lineWidth = 2; ctx.strokeStyle = color;
  path([a, b]); ctx.stroke(); ctx.setLineDash([]);
  if (!dashed) { dot(toScreen(a), color); dot(toScreen(b), color); }
  if (text) label(text, toScreen({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }), color);
}

function draw() {
  const r = stage.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  $('empty').hidden = !!img;
  if (!img) return;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, view.x, view.y, img.width * view.k, img.height * view.k);

  const sc = scale(), u = unit();
  const ref = css('--ref'), line = css('--line'), pathColor = css('--path'), area = css('--area');
  const inProgress = pendingRef ? [pendingRef.a, pendingRef.b] : null;

  data.areas.forEach(a => {
    path(a.pts, true);
    ctx.fillStyle = area + '33'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = area; ctx.stroke();
    a.pts.forEach(p => dot(toScreen(p), area));
    label(fmt(polyArea(a.pts) / (sc * sc)) + ' ' + u + '²', toScreen(centroid(a.pts)), area);
  });
  data.paths.forEach(p => {
    path(p.pts, false);
    ctx.lineWidth = 2; ctx.strokeStyle = pathColor; ctx.stroke();
    p.pts.forEach(pt => dot(toScreen(pt), pathColor));
    label(fmt(pathLength(p.pts) / sc) + ' ' + u, toScreen(centroid(p.pts)), pathColor);
  });
  data.lines.forEach(l => drawSegment(l.a, l.b, line, fmt(dist(l.a, l.b) / sc) + ' ' + u));
  data.refs.forEach(r => drawSegment(r.a, r.b, ref, fmt(r.length) + ' ' + u));
  if (inProgress) drawSegment(inProgress[0], inProgress[1], ref, null);

  // shape being drawn
  const color = tool === 'ref' ? ref : tool === 'line' ? line : tool === 'path' ? pathColor : area;
  const cur = cursor && !drag?.moved ? toImg(cursor) : null;
  if (draft.length && (tool === 'ref' || tool === 'line')) {
    dot(toScreen(draft[0]), color);
    if (cur) drawSegment(draft[0], cur, color, tool === 'line' ? fmt(dist(draft[0], cur) / sc) + ' ' + u : null, true);
  } else if (tool === 'path' && draft.length) {
    const pts = cur ? [...draft, cur] : draft;
    path(pts, false);
    ctx.lineWidth = 2; ctx.strokeStyle = pathColor; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
    draft.forEach(p => dot(toScreen(p), pathColor));
    if (pts.length >= 2) label(fmt(pathLength(pts) / sc) + ' ' + u, toScreen(pts[pts.length - 1]), pathColor);
  } else if (tool === 'area' && draft.length) {
    const pts = cur ? [...draft, cur] : draft;
    path(pts, pts.length >= 3);
    if (pts.length >= 3) { ctx.fillStyle = area + '22'; ctx.fill(); }
    ctx.lineWidth = 2; ctx.strokeStyle = area; ctx.setLineDash([6, 4]); ctx.stroke(); ctx.setLineDash([]);
    draft.forEach(p => dot(toScreen(p), area));
    if (pts.length >= 3) label(fmt(polyArea(pts) / (sc * sc)) + ' ' + u + '²', toScreen(centroid(pts)), area);
    if (draft.length >= 3) {
      const f = toScreen(draft[0]);
      ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI * 2); ctx.strokeStyle = area; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
}

// ---------- sidebar ----------
function h(tag, props, ...kids) {
  const el = Object.assign(document.createElement(tag), props);
  kids.forEach(k => el.append(k));
  return el;
}
function fill(listId, items, emptyText) {
  const ul = $(listId);
  ul.replaceChildren(...(items.length ? items : [h('li', { className: 'none', style: 'border:0' }, emptyText)]));
}
function item(color, name, sub, value, del, stacked) {
  const nm = h('span', { className: 'name' }, name);
  if (stacked && value) { value.style.display = 'block'; nm.append(value); }
  if (sub) nm.append(h('div', { className: 'sub' }, sub));
  const kids = [h('span', { className: 'dot', style: `background:${color}` }), nm];
  if (value && !stacked) kids.push(value);
  kids.push(h('button', { title: 'Delete', textContent: '✕', onclick: del }));
  return h('li', {}, ...kids);
}
function renderLists() {
  const sc = scale(), u = unit();
  $('scaleInfo').textContent = sc ? `${fmt(sc)} px per ${u}` : 'No scale yet. Use “Known distance” to mark something of known length.';

  const refRows = data.refs.map(r => {
    const dev = (dist(r.a, r.b) / r.length / sc - 1) * 100;
    const sub = data.refs.length > 1 ? `${dev >= 0 ? '+' : ''}${dev.toFixed(1)}% vs. combined scale` : `${fmt(dist(r.a, r.b))} px`;
    const input = h('input', { type: 'number', min: 0, step: 'any', value: r.length, title: 'Length' });
    input.onchange = () => { const v = parseFloat(input.value); if (v > 0) r.length = v; renderAll(); };
    const li = item(css('--ref'), `Known ${r.id}`, sub, h('span', {}, input, ' ' + u), () => {
      data.refs = data.refs.filter(x => x !== r);
      if (!data.refs.length && data.imported) $('unit').value = data.imported.unit;
      if (!scale() && (tool === 'line' || tool === 'area')) setTool('select');
      renderAll(); updateHint();
    });
    if (Math.abs(dev) > 5) li.querySelector('.sub').classList.add('warn');
    return li;
  });
  if (data.imported) {
    const im = data.imported;
    let sub = 'Copied scale';
    let warn = false;
    if (data.refs.length) {
      const own = scaleOf({ refs: data.refs });
      const diff = (own / im.pxPerUnit - 1) * 100;
      sub = `Not used. Your known distances differ by ${Math.abs(diff).toFixed(1)}%.`;
      warn = Math.abs(diff) > 5;
    }
    const li = item(css('--ref'), `Scale from ${im.from}`, sub, h('span', { className: 'val' }, `${fmt(im.pxPerUnit)} px per ${im.unit}`), () => {
      data.imported = null;
      if (!scale() && (tool === 'line' || tool === 'area')) setTool('select');
      renderAll(); updateHint();
    }, true);
    if (warn) li.querySelector('.sub').classList.add('warn');
    refRows.push(li);
  }
  fill('refList', refRows, 'None');

  fill('lineList', data.lines.map(l =>
    item(css('--line'), `Line ${l.id}`, null, h('span', { className: 'val' }, `${fmt(dist(l.a, l.b) / sc)} ${u}`),
      () => { data.lines = data.lines.filter(x => x !== l); renderAll(); })), 'None');

  fill('pathList', data.paths.map(p =>
    item(css('--path'), `Path ${p.id}`, `${p.pts.length} points`, h('span', { className: 'val' }, `${fmt(pathLength(p.pts) / sc)} ${u}`),
      () => { data.paths = data.paths.filter(x => x !== p); renderAll(); })), 'None');

  fill('areaList', data.areas.map(a =>
    item(css('--area'), `Area ${a.id}`, `Perimeter ${fmt(perimeter(a.pts) / sc)} ${u}`,
      h('span', { className: 'val' }, `${fmt(polyArea(a.pts) / (sc * sc))} ${u}²`),
      () => { data.areas = data.areas.filter(x => x !== a); renderAll(); })), 'None');

  $('refCount').textContent = data.refs.length + (data.imported ? 1 : 0);
  $('lineCount').textContent = data.lines.length;
  $('pathCount').textContent = data.paths.length;
  $('areaCount').textContent = data.areas.length;
  $('clearData').disabled = !(data.refs.length || data.lines.length || data.paths.length || data.areas.length);
  $('deleteImage').disabled = !img;
  ['line', 'path', 'area'].forEach(t => document.querySelector(`[data-tool=${t}]`).disabled = !sc);
}
function renderAll() { renderLists(); draw(); scheduleSave(); }

renderLists(); updateHint();
</script>
</body>
</html>
